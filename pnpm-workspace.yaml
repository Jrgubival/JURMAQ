packages:
  - 'apps/*'
  - 'packages/*'

# Disallow native postinstall scripts (none of our packages need them)
allowBuilds:
  sharp: false
  unrs-resolver: false

# Versiones fijas para todo el monorepo (parches de seguridad nov-2026).
overrides:
  next: 16.4.3
  react: 19.2.6
  react-dom: 19.2.6
  next-auth: 5.0.0-beta.32
  '@auth/core': 0.41.3
